name: deploy-cloudflare-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    steps:
      - name: Detect Cloudflare deployment secrets
        id: secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Install rust toolchain
        if: steps.secrets.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install pnpm
        if: steps.secrets.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install Node.js
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install wasm-pack
        if: steps.secrets.outputs.ready == 'true'
        run: cargo install wasm-pack --locked

      - name: Install binaryen
        if: steps.secrets.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Install web dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build static web shell
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm build

      - name: Skip deploy until Cloudflare secrets exist
        if: steps.secrets.outputs.ready != 'true'
        run: |
          echo "Skipping Cloudflare Pages deploy."
          echo "Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets to enable automatic production deploys."

      - name: Deploy static export to Cloudflare Pages
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          pnpm dlx wrangler@4.81.1 pages deploy apps/web/out
          --project-name=numeron
          --branch=main
          --commit-hash=${{ github.sha }}
          --commit-message="GitHub Actions deploy for ${{ github.sha }}"
          --skip-caching
