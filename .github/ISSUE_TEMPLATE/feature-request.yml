name: Feature request
description: Suggest a gameplay, shell, or release improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What player-facing or development pain should Numeron solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the feature or improvement you want
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Constraints
      description: Call out scope, release risk, and any impact on the v0.0.1 vertical slice
